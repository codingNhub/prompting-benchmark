# ═══════════════════════════════════════════════════════════
# CONFIGURATION TEMPLATE
# Copy this file to configs/config.yaml and fill in your keys
# NEVER commit configs/config.yaml — it is in .gitignore
# ═══════════════════════════════════════════════════════════

experiment:
  name: english_benchmark_v1
  language: english
  random_seed: 42
  n_examples: 100

models:
  primary: openai/gpt-oss-20b
  secondary: qwen/qwen3.6-27b
  active: primary

api:
  provider: groq
  groq_key: YOUR_GROQ_KEY_HERE
  together_key: YOUR_TOGETHER_KEY_HERE
  rate_limit_delay: 2.0
  retry_attempts: 3
  retry_wait: 60

inference:
  temperature_default: 0.0
  temperature_self_consistency: 0.7
  max_tokens_classification: 1500
  max_tokens_generation: 1000

tasks:
  - sentiment
  - ner
  - summarisation
  - qa
  - paraphrase

techniques:
  - zero_shot
  - few_shot
  - cot
  - role
  - reformulation
  - self_consistency
  - structured_output
  - few_shot_cot

bootstrap:
  n_iterations: 1000
  confidence_level: 0.95
  seed: 42

bertscore:
  model: bert-base-uncased
  rescale_with_baseline: true

paths:
  datasets: datasets/processed/
  prompts: prompts/templates/
  predictions_raw: outputs/predictions/raw/
  predictions_normalised: outputs/predictions/normalised/
  flagged: outputs/predictions/flagged/
  results: outputs/results/results_master.csv
  token_counts: outputs/token_counts/
  tables: paper/tables/
  figures: outputs/figures/
  logs: logs/