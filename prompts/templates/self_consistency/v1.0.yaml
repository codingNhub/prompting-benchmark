metadata:
  technique: self_consistency
  version: "1.0"
  created: "2026-07-08"
  description: >
    Self-consistency. Uses the zero-shot prompt but runs it three
    times at temperature 0.7. Majority vote taken across three
    responses. Applied to classification tasks only — sentiment,
    ner, paraphrase. Not applied to generation tasks.
    Grounded in Wang et al. 2022.

tasks:
  sentiment:
    template: |
      Classify the sentiment of the following sentence.
      Choose exactly one label: Positive, Negative, or Neutral.

      Sentence: {input_text}
      Sentiment:
    expected_labels: ["Positive", "Negative", "Neutral"]
    n_samples: 3
    temperature: 0.7
    voting: majority

  ner:
    template: |
      Identify all named entities in the following sentence.
      Format each entity as: ENTITY | TYPE
      Types are: PERSON, ORGANIZATION, LOCATION, OTHER
      If no entities are found, write: NONE

      Sentence: {input_text}
      Entities:
    expected_labels: ["PERSON", "ORGANIZATION", "LOCATION", "OTHER", "O"]
    n_samples: 3
    temperature: 0.7
    voting: majority

  paraphrase:
    template: |
      Do the following two sentences express the same meaning?
      Choose exactly one label: Paraphrase or Not Paraphrase.

      Sentence 1: {input_text}
      Sentence 2: {input_text_2}
      Label:
    expected_labels: ["Paraphrase", "Not Paraphrase"]
    n_samples: 3
    temperature: 0.7
    voting: majority

  summarisation:
    template: |
      NOT APPLICABLE
    note: >
      Self-consistency majority voting is not meaningful for generation
      tasks. This technique is skipped for summarisation and QA.
      Acknowledged as a scope decision in methodology section.
    expected_labels: []

  qa:
    template: |
      NOT APPLICABLE
    note: >
      Self-consistency majority voting is not meaningful for generation
      tasks. This technique is skipped for summarisation and QA.
      Acknowledged as a scope decision in methodology section.
    expected_labels: []