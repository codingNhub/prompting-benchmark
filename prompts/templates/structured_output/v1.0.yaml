metadata:
  technique: structured_output
  version: "1.0"
  created: "2026-07-08"
  description: >
    Structured output prompting. Specifies exact output format using
    a template the model must follow. Reduces parser failures and
    produces consistent, machine-readable responses.
    Particularly useful for NER and mixed-sentiment cases.

tasks:
  sentiment:
    template: |
      Read the sentence below and classify its sentiment.
      Use this exact format and nothing else:

      Sentiment: <answer>POSITIVE or NEGATIVE or NEUTRAL</answer>
      Confidence: [HIGH or MEDIUM or LOW]
      Reason: [one phrase explaining why]

      Sentence: {input_text}
    expected_labels: ["Positive", "Negative", "Neutral"]

  ner:
    template: |
      Read the sentence below and extract all named entities.
      Use this exact format for each entity found:

      ENTITY | TYPE

      Valid types: PERSON, ORGANIZATION, LOCATION, OTHER
      If no entities found, write: NONE
      Wrap your entire entity list (or NONE) in a single <answer></answer> tag.

      Sentence: {input_text}
    expected_labels: ["PERSON", "ORGANIZATION", "LOCATION", "OTHER", "O"]

  summarisation:
    template: |
      Read the article below and complete this template exactly:

      Main topic: [one or two words]
      Key event: [one sentence describing what happened]
      Summary: <answer>[one concise sentence capturing the full main point]</answer>

      Article: {input_text}
    expected_labels: []

  qa:
    template: |
      Read the question below and complete this template exactly:

      Question type: [PERSON or PLACE or DATE or NUMBER or OTHER]
      Answer: <answer>[as few words as possible]</answer>

      Question: {input_text}
    expected_labels: []

  paraphrase:
    template: |
      Read the two sentences below and complete this template exactly:

      Shared meaning: [yes or no]
      Key difference: [describe the difference or write NONE if same meaning]
      Label: <answer>PARAPHRASE or NOT PARAPHRASE</answer>

      Sentence 1: {input_text}
      Sentence 2: {input_text_2}
    expected_labels: ["Paraphrase", "Not Paraphrase"]