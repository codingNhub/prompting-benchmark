metadata:
  technique: cot
  version: "1.0"
  created: "2026-07-08"
  description: >
    Zero-shot chain of thought. Adds "Let us think step by step"
    before the answer slot. Forces the model to reason before
    committing to a label. Grounded in Kojima et al. 2022.

tasks:
  sentiment:
    template: |
      Classify the sentiment of the following sentence.
      First explain your reasoning, then write your final answer in answer tags.

      Sentence: {input_text}

      Reasoning: [think step by step here]
      Final answer must be in this exact format: <answer>LABEL</answer>
      Replace LABEL with exactly one of: Positive, Negative, Neutral
    expected_labels: ["Positive", "Negative", "Neutral"]
  ner:
    template: |
      Identify all named entities in the following sentence.
      For each entity found, write it as: ENTITY | TYPE
      Types are: PERSON, ORGANIZATION, LOCATION, OTHER

      Sentence: {input_text}

      Let us think step by step.
      Reasoning:
      Then wrap your entire entity list (or NONE) in a single <answer></answer>
      tag, e.g. <answer>Paris | LOCATION</answer>.
    expected_labels: ["PERSON", "ORGANIZATION", "LOCATION", "OTHER", "O"]

  summarisation:
    template: |
      Write a one-sentence summary of the following article.

      Article: {input_text}

      Let us think step by step about the main point of this article.
      Reasoning:
      Then wrap your one-sentence summary in <answer></answer> tags,
      e.g. <answer>Your summary here.</answer>.
    expected_labels: []

  qa:
    template: |
      Answer the following question. Your final answer must be as
      few words as possible.

      Question: {input_text}

      Let us think step by step.
      Reasoning:
      Then wrap your final answer in <answer></answer> tags,
      e.g. <answer>Paris</answer>.
    expected_labels: []

  paraphrase:
    template: |
      Do the following two sentences express the same meaning?
      Choose exactly one label: Paraphrase or Not Paraphrase.

      Sentence 1: {input_text}
      Sentence 2: {input_text_2}

      Let us think step by step.
      Reasoning:
      Then give your final answer wrapped in <answer></answer> tags,
      e.g. <answer>Paraphrase</answer>.
    expected_labels: ["Paraphrase", "Not Paraphrase"]